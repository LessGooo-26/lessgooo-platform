services:
  campus:
    build: .
    env_file:
      - path: .env.local
        required: false
    ports: ["127.0.0.1:4173:4173"]
    volumes: ["campus-data:/app/.local-data"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  campus-data:
