name: DevSecOps
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified security tools
        run: bash scripts/install-security-tools.sh
      - name: Secrets, SAST, dependencies, IaC and workflow checks
        run: bash scripts/security-checks.sh
      - name: Preserve security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: reports/
          retention-days: 7

  image:
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/install-security-tools.sh
      - name: Build once
        run: docker build --pull -t lessgooo-campus:ci .
      - name: Runtime and negative HTTP checks
        run: bash scripts/container-smoke.sh lessgooo-campus:ci
      - name: Export exact tested image and generate SBOM
        run: |
          mkdir -p reports
          docker save lessgooo-campus:ci -o reports/campus-image.tar
          trivy image --input reports/campus-image.tar --format spdx-json --output reports/sbom.spdx.json
      - name: Block high and critical image vulnerabilities
        run: |
          status=0
          trivy image --input reports/campus-image.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-image.json || status=$?
          if [[ -s reports/trivy-image.json ]]; then
            printf 'SEVERITY\tCVE\tPACKAGE\tINSTALLED\tFIXED\n'
            jq -r '.Results[] | .Vulnerabilities[]? | [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "unavailable")] | @tsv' reports/trivy-image.json
          fi
          exit "$status"
      - name: Preserve SBOM and scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence
          path: reports/*.json
          retention-days: 14
      - name: Hand tested image to publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: reports/campus-image.tar
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    environment: container-lab
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
          path: reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-evidence
          path: reports
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish the tested bytes, sign image and attest its SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:sha-$COMMIT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker load -i reports/campus-image.tar
          docker tag lessgooo-campus:ci "$tag"
          docker push "$tag"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")"
          test -n "$digest"
          cosign sign --yes "$digest"
          cosign attest --yes --predicate reports/sbom.spdx.json --type spdxjson "$digest"
          printf 'Verified promotion candidate: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, security, image]
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy-pages.yml
