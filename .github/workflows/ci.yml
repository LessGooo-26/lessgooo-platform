name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Build local container
        run: docker build -t lessgooo-campus:ci .
      - name: Verify container health
        run: |
          docker run -d --name campus-ci -p 127.0.0.1:4173:4173 lessgooo-campus:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:4173/api/health; then
              curl --fail http://127.0.0.1:4173/campus.html
              exit 0
            fi
            sleep 2
          done
          docker logs campus-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f campus-ci || true
