apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: campus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campus
    spec:
      serviceAccountName: campus
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: campus
          image: lessgooo-campus:lab
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4173
          envFrom:
            - configMapRef:
                name: campus-config
            - secretRef:
                name: campus-integrations
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1:4173"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1:4173"
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1:4173"
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/.local-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: campus-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
