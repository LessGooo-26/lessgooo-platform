apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: campus-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: campus-gp3
# Replace with a verified digest before deploying or committing promotion.
images:
  - name: lessgooo-campus
    newName: ghcr.io/lessgooo-26/lessgooo-platform
    newTag: REPLACE_WITH_VERIFIED_IMAGE
