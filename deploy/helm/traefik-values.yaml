deployment:
  replicas: 1
service:
  type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: false
ingressRoute:
  dashboard:
    enabled: false
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
