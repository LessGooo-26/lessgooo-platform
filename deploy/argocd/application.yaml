apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-lab
  namespace: argocd
spec:
  project: campus-lab
  source:
    repoURL: https://github.com/LessGooo-26/lessgooo-platform.git
    targetRevision: main
    path: deploy/k8s/overlays/eks
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
