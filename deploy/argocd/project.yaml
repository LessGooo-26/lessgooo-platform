apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: campus-lab
  namespace: argocd
spec:
  description: Only the private campus teaching namespace
  sourceRepos:
    - https://github.com/LessGooo-26/lessgooo-platform.git
  destinations:
    - namespace: campus-lab
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
