apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: lessgooo-lab
  region: eu-west-1
  version: "1.35"
iam:
  withOIDC: true
vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  # Replace with your current public IPv4 /32 before creation.
  publicAccessCIDRs: ["192.0.2.1/32"]
  nat:
    gateway: Single
managedNodeGroups:
  - name: lab-workers
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    volumeSize: 30
    disableIMDSv1: true
addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
cloudWatch:
  clusterLogging:
    enableTypes: [api, audit, authenticator]
